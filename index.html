<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Калькулятор Зарплаты Наташи</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      font-size: 16px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 16px;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      background: #ffffff;
      padding: 20px 16px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    h1 {
      font-size: 1.3rem;
      margin-bottom: 1rem;
      text-align: center;
    }

    .field-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      margin-bottom: 4px;
      font-size: 0.9rem;
    }

    input[type="number"] {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 1rem;
      -moz-appearance: textfield;
    }

    /* Remove number input arrows on mobile / some browsers */
    input[type=number]::-webkit-outer-spin-button,
    input[type=number]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .row .field-group {
      flex: 1 1 120px;
      margin-bottom: 0;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 999px;
      background: #4caf50;
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }

    button:active {
      transform: scale(0.98);
    }

    .result {
      margin-top: 16px;
      padding: 10px;
      background: #e8f5e9;
      border-radius: 8px;
      font-size: 0.95rem;
    }

    .summary {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .summary-tile {
      flex: 1 1 140px;
      padding: 12px 10px;
      border-radius: 8px;
      text-align: center;
    }

    .tile-total {
      background: #e8f5e9;
    }

    .tile-overtime {
      background: #fff3e0;
    }

    .summary-label {
      font-size: 0.8rem;
      color: #555;
      margin-bottom: 4px;
    }

    .summary-value {
      font-size: 1.15rem;
      font-weight: 700;
    }

    .summary-note {
      font-size: 0.75rem;
      color: #777;
      margin-top: 4px;
    }

    .error {
      margin-top: 8px;
      padding: 8px;
      background: #ffebee;
      border-radius: 8px;
      color: #c62828;
      font-size: 0.85rem;
    }

    @media (max-width: 400px) {
      body {
        padding: 8px;
      }

      .container {
        padding: 16px 12px;
      }

      h1 {
        font-size: 1.15rem;
      }
    }
     .popup-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      display: none; /* hidden by default */
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }

    .popup {
      background: #ffffff;
      border-radius: 16px;
      max-width: 360px;
      width: 100%;
      padding: 20px 16px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
      text-align: center;
    }

    .popup img {
      max-width: 100%;
      height: auto;
      border-radius: 12px;
      margin-bottom: 12px;
    }

    .popup-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .popup-text {
      font-size: 0.95rem;
      margin-bottom: 16px;
    }

    .popup-close-btn {
      display: inline-block;
      padding: 8px 16px;
      border-radius: 999px;
      border: none;
      background: #4caf50;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }

    .popup-close-btn:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Калькулятор Зарплаты Наташи</h1>

    <div class="field-group">
      <label>Начало рабочего дня</label>
      <div class="row">
        <div class="field-group">
          <label for="startHours">Часы (0–23)</label>
          <input type="number" id="startHours" min="0" max="23" inputmode="numeric" value="8"/>
        </div>
        <div class="field-group">
          <label for="startMinutes">Минуты (0–59)</label>
          <input type="number" id="startMinutes" min="0" max="59" inputmode="numeric" value="00" />
        </div>
      </div>
    </div>

    <div class="field-group">
      <label>Конец рабочего дня</label>
      <div class="row">
        <div class="field-group">
          <label for="endHours">Часы (0–23)</label>
          <input type="number" id="endHours" min="0" max="23" inputmode="numeric" />
        </div>
        <div class="field-group">
          <label for="endMinutes">Минуты (0–59)</label>
          <input type="number" id="endMinutes" min="0" max="59" inputmode="numeric" />
        </div>
      </div>
    </div>

    <div class="field-group">
      <label for="breakMinutes">Перерыв (минуты)</label>
      <input type="number" id="breakMinutes" min="0" inputmode="numeric" value = "30"/>
    </div>

    <div class="field-group">
      <label for="hourlySalary">Ставка в час</label>
      <input type="number" id="hourlySalary" min="0" step="0.01" inputmode="decimal" value="43"/>
    </div>

    <button id="calculateBtn">Посчитать</button>

    <div id="error" class="error" style="display: none;"></div>

    <div id="summary" class="summary" style="display: none;">
      <div class="summary-tile tile-total">
        <div class="summary-label">Всего за день</div>
        <div class="summary-value" id="summaryTotal"></div>
      </div>
      <div class="summary-tile tile-overtime">
        <div class="summary-label">Из них сверхурочные</div>
        <div class="summary-value" id="summaryOvertime"></div>
        <div class="summary-note" id="summaryOvertimeNote"></div>
      </div>
    </div>

    <div id="result" class="result" style="display: none;"></div>
  </div>
  <div id="popupOverlay" class="popup-overlay">
    <div class="popup">
      <!-- Put your picture here -->
      <img
        id="popupImage"
        src="good_job.png"
        alt="Popup image"
      />
      <div class="popup-title" id="popupTitle">
        Молодец
      </div>
      <div class="popup-text" id="popupText">
        Сегодня много заработала!
      </div>
      <button class="popup-close-btn" id="popupCloseBtn">OK</button>
    </div>
  </div>

  <script>

    function showPopup(title, text, imageUrl) {
      const overlay = document.getElementById("popupOverlay");
      const titleEl = document.getElementById("popupTitle");
      const textEl = document.getElementById("popupText");
      const imgEl = document.getElementById("popupImage");

      if (title) titleEl.textContent = title;
      if (text) textEl.textContent = text;
      if (imageUrl) imgEl.src = imageUrl;

      overlay.style.display = "flex";
    }

    function hidePopup() {
      document.getElementById("popupOverlay").style.display = "none";
    }

    document.getElementById("popupCloseBtn").addEventListener("click", hidePopup);
    // Optional: close when clicking outside the popup
    document.getElementById("popupOverlay").addEventListener("click", function (e) {
      if (e.target === this) {
        hidePopup();
      }
    });




    // Первые 8:36 — обычная ставка, следующие 2 часа — +25%, дальше — +50%
    const REGULAR_MINUTES = 8 * 60 + 36;
    const OVERTIME_125_MINUTES = 2 * 60;

    function calculateDailySalary() {
      const startHours = Number(document.getElementById("startHours").value);
      const startMinutes = Number(document.getElementById("startMinutes").value);
      const endHours = Number(document.getElementById("endHours").value);
      const endMinutes = Number(document.getElementById("endMinutes").value);
      const breakMinutes = Number(document.getElementById("breakMinutes").value);
      const hourlySalary = Number(document.getElementById("hourlySalary").value);

      const errorDiv = document.getElementById("error");
      const resultDiv = document.getElementById("result");
      const summaryDiv = document.getElementById("summary");
      errorDiv.style.display = "none";
      resultDiv.style.display = "none";
      summaryDiv.style.display = "none";

      if (
        isNaN(startHours) || isNaN(startMinutes) ||
        isNaN(endHours) || isNaN(endMinutes) ||
        isNaN(breakMinutes) || isNaN(hourlySalary)
      ) {
        errorDiv.textContent = "Заполни все поля, дура!";
        errorDiv.style.display = "block";
        return;
      }

      const startTotalMinutes = startHours * 60 + startMinutes;
      const endTotalMinutes = endHours * 60 + endMinutes;

      if (endTotalMinutes <= startTotalMinutes) {
        errorDiv.textContent = "Конец должен быть после начала (вроде бы очевидно).";
        errorDiv.style.display = "block";
        return;
      }

      let workedMinutes = endTotalMinutes - startTotalMinutes - breakMinutes;

      if (workedMinutes < 0) {
        errorDiv.textContent = "Переыв должен быть короче рабочего дня :(";
        errorDiv.style.display = "block";
        return;
      }

      const workedHours = workedMinutes / 60;

      const overtime125Minutes = Math.min(
        Math.max(workedMinutes - REGULAR_MINUTES, 0),
        OVERTIME_125_MINUTES
      );
      const overtime150Minutes = Math.max(
        workedMinutes - REGULAR_MINUTES - OVERTIME_125_MINUTES,
        0
      );

      // Все часы идут по обычной ставке, сверхурочные — только доплата сверху
      const basePay = (workedMinutes / 60) * hourlySalary;
      const overtime125Bonus = (overtime125Minutes / 60) * hourlySalary * 0.25;
      const overtime150Bonus = (overtime150Minutes / 60) * hourlySalary * 0.5;
      const dailySalary = basePay + overtime125Bonus + overtime150Bonus;

      let breakdown =
        "Все часы по ставке (" + workedHours.toFixed(2) + " h): <strong>" +
        basePay.toFixed(2) + "</strong><br>";

      if (overtime125Minutes > 0) {
        breakdown +=
          "Доплата +25% (" + (overtime125Minutes / 60).toFixed(2) + " h): <strong>" +
          overtime125Bonus.toFixed(2) + "</strong><br>";
      }

      if (overtime150Minutes > 0) {
        breakdown +=
          "Доплата +50% (" + (overtime150Minutes / 60).toFixed(2) + " h): <strong>" +
          overtime150Bonus.toFixed(2) + "</strong><br>";
      }

      resultDiv.innerHTML =
        "Количество рабочих часов  (минус перерыв): <strong>" + workedHours.toFixed(2) + " h</strong><br>" +
        breakdown +
        "Зарплата за день: <strong>" + dailySalary.toFixed(2) + "</strong>";
      resultDiv.style.display = "block";

      const overtimeMinutes = overtime125Minutes + overtime150Minutes;
      const overtimeBonus = overtime125Bonus + overtime150Bonus;

      document.getElementById("summaryTotal").textContent = dailySalary.toFixed(2);
      document.getElementById("summaryOvertime").textContent = overtimeBonus.toFixed(2);
      document.getElementById("summaryOvertimeNote").textContent =
        overtimeMinutes > 0
          ? (overtimeMinutes / 60).toFixed(2) + " h сверхурочных"
          : "сверхурочных нет";
      summaryDiv.style.display = "flex";


        if (dailySalary > 400) {
        showPopup(
          "Вау, жестко поработала!! 💰",
          "Твоя зарплата сегодня  " + dailySalary.toFixed(2) + " шекелей!!",
          "good_job.png"
        );
      }
    
    }



    document.getElementById("calculateBtn").addEventListener("click", calculateDailySalary);
  </script>
</body>
</html>
